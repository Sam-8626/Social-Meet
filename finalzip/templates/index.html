<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Obi Social - Welcome</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-signup { background: #42b72a; }
        .btn-login { background: #1877f2; }
        .toggle-link { color: #1877f2; cursor: pointer; font-size: 14px; margin-top: 15px; display: block; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        {% if message %}<p style="color: green;">{{ message }}</p>{% endif %}

        <div id="signup-box">
            <h2>Sign Up 🚀</h2>
            <form action="/signup" method="POST">
                <input type="text" name="username" placeholder="Full Name" required>
                <input type="email" name="email" placeholder="Email Address" required>
                <input type="text" name="mobile" placeholder="Mobile Number" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="btn btn-signup">Verify Email</button>
            </form>
            <a class="toggle-link" onclick="toggleForm()">Already have an account? Login</a>
        </div>

        <div id="login-box" class="hidden">
            <h2>Login 🔑</h2>
            <form action="/login" method="POST">
                <input type="text" name="login_id" placeholder="Mobile or Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="btn btn-login">Login with OTP</button>
            </form>
            <a class="toggle-link" onclick="toggleForm()">New here? Create Account</a>
        </div>
    </div>

    <script>
        function toggleForm() {
            document.getElementById('signup-box').classList.toggle('hidden');
            document.getElementById('login-box').classList.toggle('hidden');
        }
    </script>
</body>
</html>

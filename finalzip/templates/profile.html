<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark-bg: #111b21; --header-bg: #202c33; --accent: #00a884; --text-main: #e9edef; }
        body { margin: 0; background: var(--dark-bg); color: var(--text-main); font-family: sans-serif; }
        .header { background: var(--header-bg); padding: 15px; display: flex; align-items: center; }
        .container { padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .profile-img-container { position: relative; margin-bottom: 30px; }
        .profile-img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); }
        .edit-icon { position: absolute; bottom: 5px; right: 5px; background: var(--accent); padding: 10px; border-radius: 50%; cursor: pointer; }
        .input-group { width: 100%; max-width: 400px; margin-bottom: 20px; }
        .input-group label { display: block; color: var(--accent); font-size: 13px; margin-bottom: 5px; }
        .input-group input { width: 100%; background: transparent; border: none; border-bottom: 1px solid #333; color: white; padding: 10px 0; outline: none; font-size: 16px; }
        .save-btn { background: var(--accent); color: white; border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/dashboard" style="color: white; margin-right: 20px; text-decoration: none;"><i class="fas fa-arrow-left"></i></a>
        <h2 style="margin: 0; font-size: 19px;">Profile Settings</h2>
    </div>

    <form action="/update_social" method="POST" enctype="multipart/form-data" class="container">
        <div class="profile-img-container">
            {% if user.profile_pic %}
                <img src="{{ url_for('static', filename='uploads/' + user.profile_pic) }}" class="profile-img">
            {% else %}
                <img src="https://ui-avatars.com/api/?name={{ user.username }}&size=150" class="profile-img">
            {% endif %}
            <label for="file-input" class="edit-icon"><i class="fas fa-camera"></i></label>
            <input id="file-input" type="file" name="profile_pic" style="display: none;">
        </div>

        <div class="input-group">
            <label>Username</label>
            <input type="text" value="{{ user.username }}" disabled style="color: #888;">
        </div>

        <div class="input-group">
            <label>Instagram ID</label>
            <input type="text" name="instagram" value="{{ user.instagram or '' }}" placeholder="Enter Instagram ID">
        </div>

        <div class="input-group">
            <label>LinkedIn ID</label>
            <input type="text" name="linkedin" value="{{ user.linkedin or '' }}" placeholder="Enter LinkedIn ID">
        </div>

        <div class="input-group">
            <label>Twitter ID</label>
            <input type="text" name="twitter" value="{{ user.twitter or '' }}" placeholder="Enter Twitter ID">
        </div>

        <button type="submit" class="save-btn">SAVE PROFILE</button>
    </form>
</body>
</html>

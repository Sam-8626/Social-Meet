<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; text-align: center; padding-top: 100px; }
        .card { background: white; padding: 40px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { padding: 12px; margin: 15px; border-radius: 6px; border: 1px solid #ccc; font-size: 24px; width: 120px; text-align: center; letter-spacing: 5px; }
        button { padding: 10px 25px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Enter OTP 📧</h2>
        <p>Verification code sent to: <b>{{ email }}</b></p>
        <form action="/verify_otp" method="POST">
            <input type="text" name="otp" placeholder="0000" maxlength="4" required>
            <br>
            <button type="submit">Verify & Continue</button>
        </form>
        {% if error %}<p style="color: red;">{{ error }}</p>{% endif %}
    </div>
</body>
</html>
